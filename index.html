<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenMS Web</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --chat-bg: #0b1329;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --msg-in: #1e293b;
            --msg-out: #0369a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; background: var(--bg-color); color: var(--text-main); overflow: hidden; }

        /* Экраны авторизации */
        .auth-overlay {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .auth-card {
            background: var(--panel-bg); border-radius: 16px; padding: 24px;
            width: 100%; max-width: 360px; border: 1px solid var(--border-color); text-align: center;
        }
        .auth-card h2 { margin-bottom: 8px; color: var(--primary); }
        .auth-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--bg-color); color: #fff; font-size: 15px; outline: none;
        }
        .btn-primary {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--primary); color: #000; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        /* Главный контейнер */
        .app-container { display: flex; height: 100%; width: 100%; }

        /* Боковая панель (Список чатов) */
        .sidebar {
            width: 100%; max-width: 350px; background: var(--panel-bg);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column;
        }
        @media (max-width: 768px) {
            .sidebar { max-width: 100%; position: absolute; inset: 0; z-index: 10; }
            .sidebar.hidden { display: none; }
        }

        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .search-bar { padding: 10px 16px; border-bottom: 1px solid var(--border-color); }
        .search-input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: #fff; outline: none; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; cursor: pointer; align-items: center; }
        .chat-item:hover, .chat-item.active { background: var(--border-color); }
        .chat-details { flex: 1; }
        .chat-name { font-weight: bold; font-size: 15px; }
        .chat-sub { color: var(--text-muted); font-size: 13px; }

        /* Область чата */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        .chat-header { padding: 12px 16px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
        .back-btn { display: none; background: none; border: none; color: var(--primary); font-size: 20px; cursor: pointer; }
        @media (max-width: 768px) { .back-btn { display: block; } }

        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 15px; word-break: break-word; }
        .msg-bubble.in { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-bubble.out { background: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-author { font-size: 11px; color: var(--primary); margin-bottom: 4px; font-weight: bold; }

        .input-panel { padding: 12px 16px; background: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .msg-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: #fff; outline: none; }
        .send-btn { padding: 0 20px; border-radius: 10px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }

        /* Модальные окна / Настройки */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <!-- Вход по анонимному номеру -->
    <div id="authScreen" class="auth-overlay">
        <div class="auth-card">
            <h2>Вход в OpenMS</h2>
            <p>Введите ваш анонимный номер (+888) и профиль</p>
            <input type="text" id="anonPhone" class="input-field" placeholder="+888 0000 0000" value="+888 ">
            <input type="text" id="displayName" class="input-field" placeholder="Имя профиля (Никнейм)">
            <input type="text" id="username" class="input-field" placeholder="@username">
            <button class="btn-primary" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- Главный интерфейс мессенджера -->
    <div class="app-container">
        <!-- Боковое меню -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div id="userAvatar" class="avatar">U</div>
                    <div>
                        <div id="profileName" class="chat-name">Имя</div>
                        <div id="profileUsername" class="chat-sub">@username</div>
                    </div>
                </div>
                <button onclick="toggleSettings()" style="background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;">⚙️</button>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск по никнейму или @username..." oninput="filterChats()">
            </div>

            <div id="chatList" class="chat-list">
                <div class="chat-item active" onclick="selectChat('Общий чат')">
                    <div class="avatar">#</div>
                    <div class="chat-details">
                        <div class="chat-name">Общий чат</div>
                        <div class="chat-sub">Публичный канал</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Окно переписки -->
        <div class="chat-area">
            <div class="chat-header">
                <button class="back-btn" onclick="toggleSidebar(true)">←</button>
                <div id="currentChatAvatar" class="avatar">#</div>
                <div>
                    <div id="currentChatTitle" class="chat-name">Общий чат</div>
                    <div id="currentChatSub" class="chat-sub">онлайн</div>
                </div>
            </div>

            <div id="messages" class="messages-container"></div>

            <div class="input-panel">
                <input type="text" id="messageInput" class="msg-input" placeholder="Написать сообщение..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div id="settingsModal" class="modal">
        <div class="auth-card">
            <h2>Настройки</h2>
            <p id="settingsPhone">Номер: +888 ...</p>
            <br>
            <button class="btn-primary" style="background:#ef4444; color:#fff;" onclick="logout()">Выйти из аккаунта</button>
            <br><br>
            <button class="btn-primary" style="background:var(--border-color); color:#fff;" onclick="toggleSettings()">Закрыть</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let ws = null;

        function login() {
            const phone = document.getElementById('anonPhone').value.trim();
            const name = document.getElementById('displayName').value.trim();
            const username = document.getElementById('username').value.trim();

            if (!phone.startsWith('+888') || phone.length < 8) {
                alert('Введите корректный анонимный номер формата +888 XXXX XXXX');
                return;
            }
            if (!name || !username) {
                alert('Заполните Никнейм и @username');
                return;
            }

            currentUser = { phone, name, username: username.startsWith('@') ? username : '@' + username };
            
            // Сохраняем UI
            document.getElementById('profileName').textContent = currentUser.name;
            document.getElementById('profileUsername').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.name[0].toUpperCase();
            document.getElementById('settingsPhone').textContent = 'Номер: ' + currentUser.phone;
            document.getElementById('authScreen').style.display = 'none';

            initWebSocket();
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                displayMessage(data);
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (input.value.trim() !== "" && ws) {
                const payload = {
                    sender: currentUser.name,
                    username: currentUser.username,
                    text: input.value.trim()
                };
                ws.send(JSON.stringify(payload));
                input.value = '';
            }
        }

        function displayMessage(data) {
            const container = document.getElementById('messages');
            const msg = document.createElement('div');
            const isOut = data.username === currentUser.username;
            
            msg.className = `msg-bubble ${isOut ? 'out' : 'in'}`;
            msg.innerHTML = `
                <div class="msg-author">${data.sender} (${data.username})</div>
                <div>${data.text}</div>
            `;
            
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function toggleSidebar(show) {
            const sidebar = document.getElementById('sidebar');
            if (show) sidebar.classList.remove('hidden');
            else sidebar.classList.add('hidden');
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('active');
        }

        function logout() {
            location.reload();
        }

        function filterChats() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.chat-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
