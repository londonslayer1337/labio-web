<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labio Messenger</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%23000000'/><g fill='none' stroke='%23FFFFFF' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'><line x1='216' y1='120' x2='296' y2='120'/><path d='M 236,120 L 236,190 L 160,340 A 25,25 0 0,0 182,376 L 330,376 A 25,25 0 0,0 352,340 L 276,190 L 276,120'/><line x1='195' y1='310' x2='317' y2='310' stroke-width='16'/></g><circle cx='256' cy='260' r='10' fill='%23FFFFFF'/><circle cx='275' cy='220' r='7' fill='%23FFFFFF'/></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            border-left: 1px solid #1a1a1a;
            border-right: 1px solid #1a1a1a;
        }

        header {
            padding: 16px;
            background-color: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header svg {
            width: 32px;
            height: 32px;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .auth-container {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            flex: 1;
        }

        .auth-container h2 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            text-align: center;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
            background-color: #000000;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .toggle-auth {
            text-align: center;
            color: #aaaaaa;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .toggle-auth:hover {
            color: #ffffff;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            background-color: #050505;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background-color: #1a1a1a;
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            background-color: #121212;
            align-self: flex-start;
            word-wrap: break-word;
            border: 1px solid #1a1a1a;
        }

        .message.own {
            align-self: flex-end;
            background-color: #ffffff;
            color: #000000;
            border: none;
        }

        .message .sender {
            font-size: 0.75rem;
            color: #888888;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .message.own .sender {
            color: #555555;
        }

        .chat-input {
            padding: 16px;
            background-color: #0a0a0a;
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
        }

        .chat-input button {
            width: auto;
            padding: 0 24px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="110" fill="#000000"/>
            <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="216" y1="120" x2="296" y2="120"/>
                <path d="M 236,120 L 236,190 L 160,340 A 25,25 0 0,0 182,376 L 330,376 A 25,25 0 0,0 352,340 L 276,190 L 276,120"/>
                <line x1="195" y1="310" x2="317" y2="310" stroke-width="16"/>
            </g>
            <circle cx="256" cy="260" r="10" fill="#FFFFFF"/>
            <circle cx="275" cy="220" r="7" fill="#FFFFFF"/>
        </svg>
        <h1>Labio</h1>
    </header>

    <!-- Блок Авторизации -->
    <div id="authBlock" class="auth-container">
        <h2 id="authTitle">Вход в Labio</h2>
        <input type="text" id="usernameInput" placeholder="@username">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <input type="text" id="nameInput" placeholder="Отображаемое имя" class="hidden">
        <button id="authBtn" onclick="handleAuth()">Войти</button>
        <div class="toggle-auth" id="toggleAuth" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
    </div>

    <!-- Блок Чата -->
    <div id="chatBlock" class="chat-container hidden">
        <div id="messages"></div>
        <div class="chat-input">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">></button>
        </div>
    </div>
</div>

<script>
    let isRegisterMode = false;
    let currentUser = null;
    let ws = null;

    const API_URL = '';

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('authTitle').innerText = isRegisterMode ? 'Создать аккаунт' : 'Вход в Labio';
        document.getElementById('nameInput').classList.toggle('hidden', !isRegisterMode);
        document.getElementById('authBtn').innerText = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
        document.getElementById('toggleAuth').innerText = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    }

    async function handleAuth() {
        let username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const displayName = document.getElementById('nameInput').value.trim();

        if (!username || !password) return alert('Укажите @username и пароль');

        if (!username.startsWith('@')) {
            username = '@' + username;
        }

        const endpoint = isRegisterMode ? '/api/register' : '/api/login';
        const payload = isRegisterMode 
            ? { username, password, display_name: displayName || username }
            : { username, password };

        try {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Ошибка авторизации');

            if (isRegisterMode) {
                alert('Регистрация прошла успешно! Теперь войдите.');
                toggleAuthMode();
            } else {
                currentUser = data.user;
                openChat();
            }
        } catch (e) {
            alert(e.message);
        }
    }

    function openChat() {
        document.getElementById('authBlock').classList.add('hidden');
        document.getElementById('chatBlock').classList.remove('hidden');
        loadHistory();
        connectWebSocket();
    }

    async function loadHistory() {
        try {
            const res = await fetch(API_URL + '/api/messages');
            const messages = await res.json();
            const container = document.getElementById('messages');
            container.innerHTML = '';
            messages.forEach(renderMessage);
            scrollToBottom();
        } catch (e) {
            console.error('Ошибка загрузки истории:', e);
            const container = document.getElementById('messages');
            container.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">Ошибка подключения к серверу.</div>';
        }
    }

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        
        ws = new WebSocket(wsUrl);

        ws.onopen = () => console.log('WebSocket подключен');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'new_message') {
                renderMessage(data.message);
                scrollToBottom();
            }
        };

        ws.onerror = (e) => console.error('Ошибка WebSocket:', e);
        
        ws.onclose = () => {
            setTimeout(connectWebSocket, 3000);
        };
    }

    function renderMessage(msg) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        const isOwn = currentUser && msg.sender_username === currentUser.username;

        div.className = `message ${isOwn ? 'own' : ''}`;
        div.innerHTML = `
            <div class="sender">${msg.sender_name} (${msg.sender_username})</div>
            <div class="text">${msg.text}</div>
        `;
        container.appendChild(div);
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(JSON.stringify({
            type: 'message',
            sender_username: currentUser.username,
            sender_name: currentUser.display_name,
            text: text
        }));

        input.value = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function scrollToBottom() {
        const container = document.getElementById('messages');
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
